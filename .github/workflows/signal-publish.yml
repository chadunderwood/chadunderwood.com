name: Signal publish

on:
  repository_dispatch:
    types: [signal-publish]
  workflow_dispatch:
    inputs:
      body:
        description: Signal post body
        required: true
        type: string
      id:
        description: Optional id (slugified from body if empty)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: signal-publish
  cancel-in-progress: false

jobs:
  write-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build payload from dispatch / inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_BODY: ${{ inputs.body }}
          INPUT_ID: ${{ inputs.id }}
          DRAFTS_PUBLISH_SECRET: ${{ secrets.DRAFTS_PUBLISH_SECRET }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          let payload;
          if (process.env.EVENT_NAME === 'repository_dispatch') {
            payload = JSON.parse(process.env.CLIENT_PAYLOAD || '{}');
          } else {
            payload = {
              secret: process.env.DRAFTS_PUBLISH_SECRET || '',
              body: process.env.INPUT_BODY,
              id: process.env.INPUT_ID || undefined,
            };
          }
          if (payload && payload.data && typeof payload.data === 'object' && !payload.body) {
            payload = { ...payload, ...payload.data };
          }
          fs.writeFileSync('drafts-payload.json', JSON.stringify(payload));
          const keys = Object.keys(payload || {});
          console.log('payload keys:', keys.join(', ') || '(none)');
          console.log('body length:', String(payload.body || '').length);
          console.log('has secret field:', Object.prototype.hasOwnProperty.call(payload || {}, 'secret'));
          NODE

      - name: Apply signal post
        id: apply
        env:
          DRAFTS_PUBLISH_SECRET: ${{ secrets.DRAFTS_PUBLISH_SECRET }}
          SITE_URL: https://chadunderwood.com
        run: |
          set -euo pipefail
          OUT=$(DRAFTS_PAYLOAD="$(cat drafts-payload.json)" node scripts/apply-signal-publish.mjs)
          echo "$OUT"
          URL=$(echo "$OUT" | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Commit signal posts
        run: |
          set -euo pipefail
          git config user.name "drafts-publish[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/signal/posts.json
          if git diff --staged --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "content(signal): publish via Drafts"
          git push origin HEAD:main
