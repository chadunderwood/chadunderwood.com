name: Signal publish

on:
  repository_dispatch:
    types: [signal-publish]
  workflow_dispatch:
    inputs:
      body:
        description: Signal post body
        required: true
        type: string
      id:
        description: Optional id (slugified from body if empty)
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: signal-publish
  cancel-in-progress: false

jobs:
  write-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build payload from dispatch / inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_BODY: ${{ inputs.body }}
          INPUT_ID: ${{ inputs.id }}
          DRAFTS_PUBLISH_SECRET: ${{ secrets.DRAFTS_PUBLISH_SECRET }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          let payload;
          if (process.env.EVENT_NAME === 'repository_dispatch') {
            payload = JSON.parse(process.env.CLIENT_PAYLOAD || '{}');
          } else {
            payload = {
              secret: process.env.DRAFTS_PUBLISH_SECRET || '',
              body: process.env.INPUT_BODY,
              id: process.env.INPUT_ID || undefined,
            };
          }
          if (payload && payload.data && typeof payload.data === 'object' && !payload.body) {
            payload = Object.assign({}, payload, payload.data);
          }
          fs.writeFileSync('drafts-payload.json', JSON.stringify(payload));
          const keys = Object.keys(payload || {});
          const bodyLen = String(payload.body || '').trim().length;
          console.log('payload keys:', keys.join(', '));
          console.log('body length:', bodyLen);
          console.log('::notice::signal-payload keys=' + (keys.join('|') || '(none)') + ' bodyLen=' + bodyLen);
          NODE

      - name: Apply signal post
        id: apply
        env:
          DRAFTS_PUBLISH_SECRET: ${{ secrets.DRAFTS_PUBLISH_SECRET }}
          SITE_URL: https://chadunderwood.com
        run: |
          set -euo pipefail
          OUT="$(node scripts/apply-signal-publish.mjs drafts-payload.json)"
          echo "$OUT"
          URL="$(printf '%s\n' "$OUT" | grep -E '^https://' | head -1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Published URL: $URL"

      - name: Commit signal posts
        run: |
          set -euo pipefail
          git config user.name "drafts-publish[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/signal/posts.json
          if git diff --staged --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "content(signal): publish via Drafts"
          git push origin HEAD:main

      - name: Trigger Build & deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
