name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://chadunderwood.com

      - name: Ensure production robots helpers
        run: |
          test -f dist/robots.txt
          test -f dist/.htaccess
          test -f dist/robots.php

      # Native rsync (not third-party action) so we can normalize PEM newlines
      # Secrets expected:
      #   HOSTINGER_HOST, HOSTINGER_PORT, HOSTINGER_USER,
      #   HOSTINGER_SSH_KEY (full PEM; literal \\n or real newlines OK),
      #   HOSTINGER_REMOTE_PATH (e.g. domains/chadunderwood.com/public_html/)
      - name: Deploy dist via rsync/SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH }}
        run: |
          set -euo pipefail
          test -n "${HOSTINGER_HOST}"
          test -n "${HOSTINGER_PORT}"
          test -n "${HOSTINGER_USER}"
          test -n "${HOSTINGER_SSH_KEY}"
          test -n "${HOSTINGER_REMOTE_PATH}"
          mkdir -p ~/.ssh
          # Normalize Windows newlines and literal \n sequences from secret paste
          printf '%s\n' "${HOSTINGER_SSH_KEY}" \
            | sed 's/\r$//' \
            | sed 's/\\n/\n/g' \
            > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          # Key must look like a PEM
          head -1 ~/.ssh/hostinger_key | grep -q 'BEGIN'
          ssh-keyscan -p "${HOSTINGER_PORT}" -H "${HOSTINGER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete \
            -e "ssh -p ${HOSTINGER_PORT} -i ~/.ssh/hostinger_key -o StrictHostKeyChecking=accept-new" \
            --exclude 'wp-content' --exclude 'ads.txt' \
            dist/ "${HOSTINGER_USER}@${HOSTINGER_HOST}:${HOSTINGER_REMOTE_PATH}"
