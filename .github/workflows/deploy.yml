name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://chadunderwood.com

      - name: Ensure production robots helpers
        run: |
          test -f dist/robots.txt
          test -f dist/.htaccess
          test -f dist/robots.php

      - name: Deploy dist via SFTP
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete --exclude 'wp-content' --exclude 'ads.txt'
          path: dist/
          remote_path: ${{ secrets.HOSTINGER_REMOTE_PATH }}
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}
